[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-hermes"
version = "1.0.0"
description = "Hosted System-One typed decisions for Hermes Agent via TypeSafe's Jev decision API — decision tools, routing hints, output filtering, and a smart compaction context engine. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "pavlealeksic" }]
keywords = ["hermes-agent", "jev", "typesafe", "context-engine", "compaction", "decisions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
# Zero runtime dependencies: the API client is pure stdlib urllib.
dependencies = []

[project.urls]
Homepage = "https://github.com/pavlealeksic/jev-hermes"
Repository = "https://github.com/pavlealeksic/jev-hermes"

# Hermes discovers pip-installed plugins through this entry-point group;
# the entry-point name must match the manifest name (jev).
[project.entry-points."hermes_agent.plugins"]
jev = "jev_hermes"

[tool.setuptools]
packages = ["jev_hermes"]

[tool.setuptools.package-data]
jev_hermes = ["plugin.yaml", "SKILL.md"]
